[package]
name = "roqtune-core"
version = "0.1.0"
edition = "2021"

[dependencies]
log = "0.4.29"
rand = "0.10.0"
getrandom = "0.4.1"
symphonia = { version = "0.5.5", features = ["all"] }
cpal = "0.15.3"
tokio = { version = "1.49.0", features = ["sync", "rt", "net", "time"] }
rubato = "0.16.2"
dirs = "6.0.0"
toml = "0.9.12"
toml_edit = "0.25.0"
serde = "1.0.228"
serde_json = "1.0.149"
chrono = { version = "0.4.43", default-features = false, features = ["clock"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
governor = "0.10.4"
souvlaki = "0.8.3"
lofty = "0.23.1"
ureq = { version = "2.12.1", features = ["json"] }
urlencoding = "2.1.3"
webbrowser = "1.0.6"
native-tls = "0.2.14"
mdns-sd = "0.17.0"
audio-mixer = "0.2.0"
keyring = "2.3.3"
md5 = "0.8.0"
showfile = "0.1.1"
image = "0.25.9"
zune-core = "0.4.12"
zune-jpeg = "0.4.21"
uuid = { version = "1.20.0", features = ["v4"] }
